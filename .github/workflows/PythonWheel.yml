name: Python wheel

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'python/rmc-numerics/**'
      - '.github/workflows/PythonWheel.yml'
  workflow_dispatch:

jobs:
  wheel:
    name: rmc-numerics (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025 ]
        python: [ '3.12', '3.14' ]
    defaults:
      run:
        shell: bash
        working-directory: python/rmc-numerics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel (Numerics.dll from the pinned nuget.org package, SHA-256 checked)
        run: |
          python -m pip install build
          python scripts/build_wheel.py --download --out dist

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install dist/rmc_numerics-*-py3-none-any.whl pytest numpydoc ruff

      - name: Lint
        run: |
          "$PY" -m ruff check src tests scripts

      - name: Test the installed wheel
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          "$PY" -m pytest -q -p no:cacheprovider tests

      - name: Upload the wheel
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: rmc-numerics-wheel
          path: python/rmc-numerics/dist/*.whl
